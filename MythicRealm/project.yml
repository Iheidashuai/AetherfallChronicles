name: MythicRealm
options:
  bundleIdPrefix: com.mythicrealm
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

targets:
  MythicRealm:
    type: application
    platform: iOS
    sources:
      - path: MythicRealm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mythicrealm.game
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
    info:
      path: MythicRealm/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

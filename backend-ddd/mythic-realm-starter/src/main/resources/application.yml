spring:
  config:
    import:
      - optional:file:.local/application-ai.yml
      - optional:file:../.local/application-ai.yml
      - optional:file:../../.local/application-ai.yml

  application:
    name: mythic-realm

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mythicrealm?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
      connection-timeout: 3000

  redis:
    host: localhost
    port: 6379
    database: 0

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 18080

logging:
  level:
    com.mythicrealm: DEBUG

mythic:
  database:
    schema-location: classpath:db/latest_schema.sql
    rebuild-on-start: false
  admin:
    usernames: 123456,hero
  ai:
    provider: openai-compatible
    chat:
      enabled: true
      dry-run: false
      max-calls-per-minute: 6
      channel-cooldown-seconds: 10
  config:
    version: v2.0-combat-db-source

# Robot simulation cadence. The seed population size (~400) lives in the schema;
# these knobs tune how lively that population feels. Sized so each robot acts
# roughly every few minutes while the world stays busy.
mythicrealm:
  robot:
    full-population-enabled: true
    max-robots-per-tick: 400
    tick-time-budget-ms: 4500
    healthy-tick-time-ms: 3500
    decision-virtual-concurrency: 400
    execution-parallelism: 16
    robots-per-tick: 48
    min-actions-per-tick: 28
    extra-action-range: 13
    world-chat-retention: 400
    world-chat-cooldown-seconds: 6
    activity-log-retention: 4000
    action-budgets:
      combat-base: 100
      combat-cap: 240
      equipment-base: 80
      equipment-cap: 200
      market-base: 100
      market-cap: 220
      light-base: 160
      light-cap: 320
      world-chat-base: 6
      world-chat-cap: 12
      activity-log-base: 220
      activity-log-cap: 320
    # 被动成长：按真实时间持续给机器人加经验/战力（离线也长），让榜单梯队不断往上爬。
    passive-growth-interval-ms: 180000
    passive-levels-per-hour: 0.5

server:
  port: ${MYTHIC_SERVER_PORT:8080}

spring:
  application:
    name: mythicrealm-backend
  datasource:
    url: ${MYTHIC_DB_URL:jdbc:mysql://127.0.0.1:3307/mythicrealm?useUnicode=true&characterEncoding=utf8&connectionTimeZone=SERVER}
    username: ${MYTHIC_DB_USERNAME:mythic}
    password: ${MYTHIC_DB_PASSWORD:mythic}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${MYTHIC_REDIS_HOST:localhost}
      port: ${MYTHIC_REDIS_PORT:6379}
      password: ${MYTHIC_REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

mythic:
  config:
    version: local-ios-port-v1
  auth:
    session-days: 14
